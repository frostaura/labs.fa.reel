# Production stack — THE production descriptor: the file content behind the Portainer stack for
# reel.frostaura.net, and the only one (K-14). It mirrors docker-compose.yml but pulls published
# multi-arch images instead of building. CI's deploy-portainer job sets REEL_TAG to the commit it
# just built (`sha-<short>`) and redeploys this stack, then polls /health until that commit answers.
#
# Topology — ONE way in (docs/deployment.md#network-exposure). The `cloudflared` service below runs
# the Cloudflare tunnel INSIDE this stack and reaches the gateway by service name (http://gateway:80)
# over the pinned bridge network. No service publishes a host port: not the gateway, not the API, not
# the SPA, not Postgres. The tunnel is the only path from the internet to anything here, and the
# gateway is the only thing the tunnel can reach that matters.
#
# Required stack env vars: POSTGRES_PASSWORD, JWT_SECRET, TRAKT_CLIENT_ID, TRAKT_CLIENT_SECRET,
# TMDB_READ_ACCESS_TOKEN, CLOUDFLARE_TUNNEL_TOKEN and BACKUP_HOST_DIR (an absolute host path, ideally
# a mount of off-host storage; never a volume of this stack — docs/deployment.md#backups-and-restore).
# OPENROUTER_API_KEY is optional to boot but every LLM feature is off without it.
# REEL_TAG pins all three Reel images together (default `latest`; a rollback is a REEL_TAG change).
# Every other backend key has a default here and is documented in .env.example; the LLM ceilings
# the process actually resolved are printed in one startup log line ("Effective LLM ceilings").
# Every service logs through Docker's `local` driver with rotation (J*2). The json-file default kept
# about 30 minutes of the backend's log on the live host, which made every after-the-fact diagnosis
# a guess. Sized for at least 72 h per container (R1-37): 10 x 100 MB uncompressed holds 85 h at the
# 200 KB/min idle-volume ceiling (72 h needs 844 MB); the `local` driver also compresses rotated files.
# ComposeHardeningTests asserts the arithmetic, not the literal.
x-logging: &default-logging
  driver: local
  options:
    max-size: "100m"
    max-file: "10"

# The stack's bridge is PINNED rather than left to Docker's default pool, because the backend
# believes X-Forwarded-* only from this /24 (TRUSTED_PROXY_NETWORKS below) — the gateway and
# cloudflared are the only two hops that ever set those headers, and both live here. It sits in 10/8
# on purpose, outside Docker's default address pools (172.17.0.0/12 and 192.168.0.0/16), so Docker
# can never hand it to another network and the stack can never fail to deploy with "Pool overlaps".
# One /24 away from technologies.crusaders.squash-control-system's 10.83.29.0/24, so both stacks can share a host. If the
# host's LAN is 10.83.30.x, pick another free /24 and change it HERE AND in TRUSTED_PROXY_NETWORKS;
# ComposeHardeningTests holds the two equal.
networks:
  default:
    ipam:
      config:
        - subnet: 10.83.30.0/24

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-reel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    logging: *default-logging
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-reel} -d ${POSTGRES_DB:-reel}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    image: ${DOCKERHUB_USERNAME:-frostaura}/labs.fa.reel-backend:${REEL_TAG:-latest}
    restart: unless-stopped
    # SIGTERM → 45 s for in-flight requests (an Ask turn streams for up to a minute) and the job
    # runner's current claim to finish before SIGKILL; Docker's default is 10 s (K-12).
    stop_grace_period: 45s
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${POSTGRES_DB:-reel};Username=${POSTGRES_USER:-reel};Password=${POSTGRES_PASSWORD}
      Database__AutoMigrateOnStartup: ${Database__AutoMigrateOnStartup:-true}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_ISSUER: ${JWT_ISSUER:-frostaura-reel}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-frostaura-reel-app}
      JWT_ACCESS_TOKEN_EXPIRY_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:-15}
      JWT_REFRESH_TOKEN_EXPIRY_DAYS: ${JWT_REFRESH_TOKEN_EXPIRY_DAYS:-30}
      # Trakt slugs whose sign-in is granted the Founder tier (K-10, FD-11); blank grants nobody.
      FOUNDER_TRAKT_SLUGS: ${FOUNDER_TRAKT_SLUGS:-}
      # Edge security (docs/deployment.md#edge-security): the proxies whose X-Forwarded-* the API
      # believes, the per-account Ask turn limits (FD-8) and the key-ring certificate (J-12).
      # Exactly the pinned bridge above: cloudflared -> gateway -> API, nothing else.
      TRUSTED_PROXY_NETWORKS: "${TRUSTED_PROXY_NETWORKS:-10.83.30.0/24}"
      ASK_TURNS_CONCURRENT: ${ASK_TURNS_CONCURRENT:-1}
      ASK_TURNS_PER_MINUTE: ${ASK_TURNS_PER_MINUTE:-6}
      ASK_TURNS_PER_HOUR: ${ASK_TURNS_PER_HOUR:-20}
      ASK_TURNS_PER_DAY: ${ASK_TURNS_PER_DAY:-100}
      ASK_TURNS_PER_DAY_FOUNDER: ${ASK_TURNS_PER_DAY_FOUNDER:-300}
      ASK_TURNS_PER_DAY_FREE: ${ASK_TURNS_PER_DAY_FREE:-10}
      DATAPROTECTION_CERT_PATH: ${DATAPROTECTION_CERT_PATH:-}
      DATAPROTECTION_CERT_PASSWORD: ${DATAPROTECTION_CERT_PASSWORD:-}
      DATAPROTECTION_OLD_CERT_PATHS: ${DATAPROTECTION_OLD_CERT_PATHS:-}
      TRAKT_CLIENT_ID: ${TRAKT_CLIENT_ID:?TRAKT_CLIENT_ID is required}
      TRAKT_CLIENT_SECRET: ${TRAKT_CLIENT_SECRET:?TRAKT_CLIENT_SECRET is required}
      TRAKT_REDIRECT_URI: ${TRAKT_REDIRECT_URI:-https://reel.frostaura.net/auth/trakt/callback}
      TRAKT_RATE_BUDGET_PER_5MIN: ${TRAKT_RATE_BUDGET_PER_5MIN:-900}
      TMDB_READ_ACCESS_TOKEN: ${TMDB_READ_ACCESS_TOKEN:?TMDB_READ_ACCESS_TOKEN is required}
      TMDB_RATE_PER_SEC: ${TMDB_RATE_PER_SEC:-40}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-6-luna}
      OPENROUTER_BASE_URL: ${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      OPENROUTER_MAX_CONCURRENCY: ${OPENROUTER_MAX_CONCURRENCY:-4}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-text-embedding-3-small}
      EMBEDDINGS_BASE_URL: ${EMBEDDINGS_BASE_URL:-https://openrouter.ai/api/v1}
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-$OPENROUTER_API_KEY}
      REEL_SEARCH_MODEL: ${REEL_SEARCH_MODEL:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SYNC_DELTA_MINUTES: ${SYNC_DELTA_MINUTES:-15}
      SYNC_HOT_MINUTES: ${SYNC_HOT_MINUTES:-5}
      RETRAIN_MIN_NEW_RATINGS: ${RETRAIN_MIN_NEW_RATINGS:-10}
      GEOIP_DEFAULT_REGION: ${GEOIP_DEFAULT_REGION:-US}
      # LLM spend ceilings per account per day (K-5: these never reached the container before).
      # Blank means "the code default"; the effective numbers are printed in one startup log line
      # beginning "Effective LLM ceilings". LLM_XREF_DAILY_CALLS=0 is the cross-reference off switch.
      LLM_XREF_DAILY_CALLS: ${LLM_XREF_DAILY_CALLS:-}
      LLM_XREF_DAILY_TOKENS: ${LLM_XREF_DAILY_TOKENS:-}
      # model=effort pairs a model is known to reject (comma-separated); learned at runtime when blank.
      LLM_EFFORT_UNSUPPORTED: ${LLM_EFFORT_UNSUPPORTED:-}
      LLM_RERANK_DAILY_CALLS: ${LLM_RERANK_DAILY_CALLS:-}
      LLM_RERANK_DAILY_TOKENS: ${LLM_RERANK_DAILY_TOKENS:-}
      LLM_LENS_DAILY_CALLS: ${LLM_LENS_DAILY_CALLS:-}
      LLM_LENS_DAILY_TOKENS: ${LLM_LENS_DAILY_TOKENS:-}
      # Reasoning effort for the lens and the taste narrative (none|minimal|low|medium|high|omit). Both
      # notes are cached on model|effort, so a change re-writes them; blank = the code default, none.
      LLM_LENS_EFFORT: ${LLM_LENS_EFFORT:-}
      LLM_TASTE_NARRATIVE_EFFORT: ${LLM_TASTE_NARRATIVE_EFFORT:-}
      # Model and experiment switches (blank = code default; see CLAUDE.md "Runtime flags").
      CALIBRATOR_MODE: ${CALIBRATOR_MODE:-}
      RESIDUAL_HEAD_ENABLED: ${RESIDUAL_HEAD_ENABLED:-}
      RESIDUAL_OBSERVE_TRAKT_RATINGS: ${RESIDUAL_OBSERVE_TRAKT_RATINGS:-}
      INTERLEAVE_ENABLED: ${INTERLEAVE_ENABLED:-}
      INTERLEAVE_POLICY_A: ${INTERLEAVE_POLICY_A:-}
      INTERLEAVE_POLICY_B: ${INTERLEAVE_POLICY_B:-}
      INTERLEAVE_ALPHA: ${INTERLEAVE_ALPHA:-}
      INTERLEAVE_MSPRT_TAU: ${INTERLEAVE_MSPRT_TAU:-}
      INTERLEAVE_SINCE: ${INTERLEAVE_SINCE:-}
      KILL_CRITERION_ITERATIONS: ${KILL_CRITERION_ITERATIONS:-3}
      ASK_RETENTION_DAYS: ${ASK_RETENTION_DAYS:-}
      # WS-2 Ask Reel engine: v1 (default) or v2; anything else reads as v1. v1 stays selectable through the soak.
      ASK_ENGINE: ${ASK_ENGINE:-v1}
      ENRICH_MAX_TITLES_PER_RUN: ${ENRICH_MAX_TITLES_PER_RUN:-}
      # Background loops — each a kill switch. These are read with typed parsing, so a blank value
      # would fail the read: the defaults are spelled out.
      Background__JobRunner: ${Background__JobRunner:-true}
      Background__DeltaPoll: ${Background__DeltaPoll:-true}
      Background__TokenRefresh: ${Background__TokenRefresh:-true}
      Background__OutboxDispatcher: ${Background__OutboxDispatcher:-true}
      Background__NightlyReconcile: ${Background__NightlyReconcile:-true}
      Background__Digest: ${Background__Digest:-true}
      Background__CatalogGrowth: ${Background__CatalogGrowth:-true}
      Background__CatalogFollowThrough: ${Background__CatalogFollowThrough:-true}
      Background__LanguageBackfill: ${Background__LanguageBackfill:-true}
      # WS-4 one-off boot repairs (idempotent; never write to Trakt). WS-5 untrusted-snapshot purge:
      # blank follows Background__NightlyReconcile; set false on any host started on a copied database.
      Background__DataRepairs: ${Background__DataRepairs:-true}
      Background__TrustPurge: ${Background__TrustPurge:-}
      # WS-3 keyword vocabulary label embeddings (about 20 embedding calls on a fresh catalogue); off on slots and eval.
      Background__KeywordVocabulary: ${Background__KeywordVocabulary:-true}
      # WS-4 Trakt community ratings for the catalogue; tokenless, rate-gated; off on slots and eval.
      Background__TraktRatingsBackfill: ${Background__TraktRatingsBackfill:-true}
      # WS-6 daily retention purge (terminal jobs > 30 d, superseded scores > 14 d, expired sessions).
      Background__Retention: ${Background__Retention:-true}
      # WS-6 tenancy: Allow | Warn | Throw for a scoped query with no account pinned; blank is Throw; set Warn to roll back.
      Tenancy__UnscopedReads: ${Tenancy__UnscopedReads:-}
      Push__Subject: ${Push__Subject:-https://reel.frostaura.net}
      # The dump before any pending migration (K-1): the API asks the backup service over the shared
      # backup_requests volume and refuses to migrate without an answer. docs/deployment.md#backups-and-restore.
      BACKUP_REQUEST_DIR: /backup-requests
      BACKUP_PRE_MIGRATION_TIMEOUT_SECONDS: ${BACKUP_PRE_MIGRATION_TIMEOUT_SECONDS:-1800}
      BACKUP_PRE_MIGRATION_REQUIRED: ${BACKUP_PRE_MIGRATION_REQUIRED:-true}
      # Catalogue bulk seed (POST /api/dev/seed-catalog) and the daily ceilings that complete it.
      # The two vote floors decide how big the seeded corpus is: measured 2026-09-10 the defaults
      # yield ~9,300 titles, and 50/50 yields ~34,800. EXTRACT_DAILY_TOKENS is the only one that
      # costs real money — 1.5M tokens is ~$0.15/day at gpt-6-luna input pricing, ~1,360 titles.
      SEED_MOVIE_MIN_VOTES: ${SEED_MOVIE_MIN_VOTES:-500}
      SEED_SHOW_MIN_VOTES: ${SEED_SHOW_MIN_VOTES:-200}
      SEED_PAGES_PER_RUN: ${SEED_PAGES_PER_RUN:-400}
      SEED_MAX_TITLES: ${SEED_MAX_TITLES:-60000}
      HYDRATE_MAX_TITLES_PER_DAY: ${HYDRATE_MAX_TITLES_PER_DAY:-1500}
      EXTRACT_DAILY_TOKENS: ${EXTRACT_DAILY_TOKENS:-1500000}
      EMBED_DAILY_TOKENS: ${EMBED_DAILY_TOKENS:-3000000}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-https://reel.frostaura.net}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://reel.frostaura.net}
    # /health/ready, not /health: /health answers "the process is up", which was already true while
    # the database was unreachable or the schema was a migration behind — so the gateway's
    # `condition: service_healthy` was gating on nothing. /health/ready checks both.
    # start_period is 40m because the listener opens only AFTER the pre-migration dump and the
    # migrations (both awaited ahead of app.Run()), so the backend answers nothing at all while they
    # run. The dump wait is capped at 30 minutes (BACKUP_PRE_MIGRATION_TIMEOUT_SECONDS, max 1800):
    # a request can queue behind a nightly dump (about 6 minutes on the live database) and then take
    # its own. With 120s the backend went unhealthy at about 7 minutes and `up` never started the
    # gateway. The first passing probe ends the period, so this costs nothing on the happy path.
    # ComposeHardeningTests pins it against the timeout's maximum.
    healthcheck:
      test: [ "CMD-SHELL", "curl --fail --silent http://127.0.0.1:5000/health/ready >/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40m
    volumes:
      - backup_requests:/backup-requests
    depends_on:
      postgres:
        condition: service_healthy
      backup:
        condition: service_started
    logging: *default-logging

  # Nightly pg_dump -Fc (14 daily + 8 weekly kept) and the dump the backend asks for before it
  # migrates (K-1). Same image as postgres, so pg_dump always matches the server's major version.
  # The script is inlined below as a compose config because a Portainer stack cannot mount a repo
  # file; deploy/backup/reel-backup.sh is the canonical copy and BackupDescriptorParityTests keeps
  # this one identical to it. Dumps go to BACKUP_HOST_DIR, a required absolute host
  # path (FD-12): never a volume of this stack, which `down -v` or a stack removal deletes together
  # with the database it backs up. Restore: docs/deployment.md#backups-and-restore.
  backup:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    entrypoint: [ "/bin/sh", "/usr/local/bin/reel-backup.sh" ]
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-reel}
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATABASE: ${POSTGRES_DB:-reel}
      BACKUP_HOUR_UTC: ${BACKUP_HOUR_UTC:-2}
      BACKUP_KEEP_DAILY: ${BACKUP_KEEP_DAILY:-14}
      BACKUP_KEEP_WEEKLY: ${BACKUP_KEEP_WEEKLY:-8}
      BACKUP_KEEP_PRE_MIGRATION: ${BACKUP_KEEP_PRE_MIGRATION:-10}
    configs:
      - source: reel_backup_script
        target: /usr/local/bin/reel-backup.sh
    volumes:
      - ${BACKUP_HOST_DIR:?BACKUP_HOST_DIR must name an absolute host directory for the dumps (FD-12)}:/backups
      - backup_requests:/backup-requests
    # Unhealthy when the newest successful dump is older than 26 hours.
    healthcheck:
      test: [ "CMD-SHELL", "test -n \"$$(find /backups/last-success -mmin -1560 2>/dev/null)\"" ]
      interval: 5m
      timeout: 10s
      retries: 1
      start_period: 10m
    depends_on:
      postgres:
        condition: service_healthy
    logging: *default-logging

  frontend:
    image: ${DOCKERHUB_USERNAME:-frostaura}/labs.fa.reel-frontend:${REEL_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - backend
    logging: *default-logging

  # The single entry point. A built image (nginx/Dockerfile bakes nginx/nginx.conf), pinned by
  # REEL_TAG with the backend and frontend, so a gateway change ships by the same redeploy as the code
  # behind it. Deliberately NO `ports:` — cloudflared reaches it as http://gateway:80 on the bridge.
  gateway:
    image: ${DOCKERHUB_USERNAME:-frostaura}/labs.fa.reel-gateway:${REEL_TAG:-latest}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    logging: *default-logging

  # The public edge: the Cloudflare tunnel for reel.frostaura.net, run as a service of THIS stack.
  # The tunnel's public hostname targets http://gateway:80 (set in Cloudflare Zero Trust, not here).
  # Pinned to a released version, never `latest`, and --no-autoupdate, so the edge only changes when
  # this file does. The token arrives as TUNNEL_TOKEN (cloudflared's own variable for `tunnel run`) so
  # it is not on the process command line; anyone holding it can run the tunnel — rotate it in the
  # Cloudflare dashboard if it is ever pasted anywhere.
  cloudflared:
    image: cloudflare/cloudflared:2026.10.0
    restart: unless-stopped
    command: [ "tunnel", "--no-autoupdate", "run" ]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:?CLOUDFLARE_TUNNEL_TOKEN is required (the reel tunnel's token)}
    depends_on:
      - gateway
    logging: *default-logging

# The backup script ships inline because a Portainer stack cannot mount a repo file; the gateway's
# nginx config no longer does — it is baked into the labs.fa.reel-gateway image (nginx/Dockerfile).
configs:
  reel_backup_script:
    content: |
      #!/bin/sh
      # Reel database backups: nightly pg_dump -Fc with 14 daily + 8 weekly kept, plus a dump on
      # request before the API applies a pending migration. Canonical copy; docker-compose.prod.yml
      # inlines it byte for byte (with $$ escaped as $$$$), pinned by BackupDescriptorParityTests.
      # Runbook: docs/deployment.md#backups-and-restore.
      #
      #   reel-backup.sh          run forever (the sidecar)
      #   reel-backup.sh once     take one daily dump now and exit (drills, manual safety copies)
      #
      # Reads the standard libpq variables (PGHOST, PGPORT, PGUSER, PGPASSWORD, PGDATABASE).
      # Every file this script lists is one it named itself (reel-<date>.dump), so ls is safe here.
      # shellcheck disable=SC2012
      set -u

      BACKUP_DIR="$${BACKUP_DIR:-/backups}"
      REQUEST_DIR="$${BACKUP_REQUEST_DIR:-/backup-requests}"
      HOUR_UTC="$${BACKUP_HOUR_UTC:-2}"
      KEEP_DAILY="$${BACKUP_KEEP_DAILY:-14}"
      KEEP_WEEKLY="$${BACKUP_KEEP_WEEKLY:-8}"
      KEEP_PRE_MIGRATION="$${BACKUP_KEEP_PRE_MIGRATION:-10}"
      # A scheduled dump never starts in the first GRACE seconds after this service starts: a backend
      # started with it (a fresh stack, a G0 rebuild) asks for its pre-migration dump within seconds, and
      # a request queued behind a full first-start dump waited for two dumps instead of one.
      GRACE="$${BACKUP_FIRST_DUMP_GRACE_SECONDS:-120}"
      WEEKLY_DAY="$${BACKUP_WEEKLY_DAY:-7}"
      DB="$${PGDATABASE:-reel}"

      log() { echo "$$(date -u +%Y-%m-%dT%H:%M:%SZ) reel-backup: $$*"; }

      # dump <destination file>: pg_dump to a .partial, prove the archive reads back, then rename.
      dump() {
        dest="$$1"
        partial="$$dest.partial"
        started=$$(date -u +%s)
        if ! pg_dump -Fc -Z 6 -d "$$DB" -f "$$partial"; then
          rm -f "$$partial"
          log "FAILED pg_dump for $$dest"
          echo "$$(date -u +%Y-%m-%dT%H:%M:%SZ) pg_dump failed for $$dest" > "$$BACKUP_DIR/last-failure"
          return 1
        fi
        if ! pg_restore --list "$$partial" > /dev/null; then
          rm -f "$$partial"
          log "FAILED archive check for $$dest"
          echo "$$(date -u +%Y-%m-%dT%H:%M:%SZ) archive check failed for $$dest" > "$$BACKUP_DIR/last-failure"
          return 1
        fi
        mv "$$partial" "$$dest"
        bytes=$$(wc -c < "$$dest" | tr -d ' ')
        log "wrote $$dest ($$bytes bytes, $$(( $$(date -u +%s) - started ))s)"
        echo "$$(date -u +%Y-%m-%dT%H:%M:%SZ) $$dest $$bytes" > "$$BACKUP_DIR/last-success"
        return 0
      }

      # prune <directory> <keep>: newest <keep> dumps survive; names sort by date.
      prune() {
        ls -1 "$$1"/reel-*.dump 2> /dev/null | sort -r | tail -n +"$$(( $$2 + 1 ))" | while read -r old; do
          rm -f "$$old"
          log "pruned $$old"
        done
      }

      # keep_as_daily <verified dump>: today's daily copy (a hard link when the dump is not already it),
      # the weekly copy when one is due, then retention.
      keep_as_daily() {
        today=$$(date -u +%Y-%m-%d)
        dest="$$BACKUP_DIR/daily/reel-$$today.dump"
        if [ "$$1" != "$$dest" ] && [ ! -e "$$dest" ]; then
          ln -f "$$1" "$$dest" 2> /dev/null || cp "$$1" "$$dest"
          log "kept $$1 as today's daily dump"
        fi
        newest_weekly=$$(ls -1 "$$BACKUP_DIR"/weekly/reel-*.dump 2> /dev/null | sort -r | head -n 1)
        week_ago=$$(date -u -d "@$$(( $$(date -u +%s) - 6 * 86400 ))" +%Y%m%d)
        if [ "$$(date -u +%u)" = "$$WEEKLY_DAY" ] || [ -z "$$newest_weekly" ] \
          || [ "$$(basename "$$newest_weekly" .dump | cut -c6- | tr -d '-')" -lt "$$week_ago" ]; then
          # A hard link costs no space and outlives the daily copy's pruning; cp where links are refused.
          ln -f "$$dest" "$$BACKUP_DIR/weekly/reel-$$today.dump" 2> /dev/null || cp "$$dest" "$$BACKUP_DIR/weekly/reel-$$today.dump"
          log "kept weekly copy reel-$$today.dump"
        fi
        prune "$$BACKUP_DIR/daily" "$$KEEP_DAILY"
        prune "$$BACKUP_DIR/weekly" "$$KEEP_WEEKLY"
      }

      daily() {
        dest="$$BACKUP_DIR/daily/reel-$$(date -u +%Y-%m-%d).dump"
        dump "$$dest" || return 1
        keep_as_daily "$$dest"
      }

      # answer <request> <suffix> <text>: written atomically, and owned by whoever wrote the request, so
      # an API running as a non-root user can delete the answer it reads.
      answer() {
        file="$$REQUEST_DIR/$$(basename "$$1" .request)$$2"
        echo "$$3" > "$$file.partial"
        chown "$$(stat -c %u:%g "$$1" 2> /dev/null || echo 0:0)" "$$file.partial" 2> /dev/null || true
        mv "$$file.partial" "$$file"
      }

      # Requests from the API: <id>.request in, <id>.done or <id>.failed out.
      serve_requests() {
        for request in "$$REQUEST_DIR"/*.request; do
          [ -e "$$request" ] || continue
          id=$$(basename "$$request" .request)
          dest="$$BACKUP_DIR/pre-migration/reel-$$id.dump"
          log "pre-migration dump requested: $$id ($$(tr '\n' ' ' < "$$request"))"
          if dump "$$dest"; then
            answer "$$request" .done "$$dest"
            # A full, verified dump: it is also today's daily if today has none, so a fresh stack does
            # not take a second full dump minutes after this one.
            keep_as_daily "$$dest"
          else
            answer "$$request" .failed "pg_dump failed; see the backup container log"
          fi
          rm -f "$$request"
          prune "$$BACKUP_DIR/pre-migration" "$$KEEP_PRE_MIGRATION"
        done
        # Answers nobody collected (a requester that timed out and withdrew) are dropped after a day.
        find "$$REQUEST_DIR" -maxdepth 1 \( -name '*.done' -o -name '*.failed' -o -name '*.partial' \) -mmin +1440 -delete 2> /dev/null || true
      }

      wait_for_database() {
        until pg_isready -q -d "$$DB"; do
          log "waiting for $$DB"
          sleep 5
        done
      }

      mkdir -p "$$BACKUP_DIR/daily" "$$BACKUP_DIR/weekly" "$$BACKUP_DIR/pre-migration" "$$REQUEST_DIR"
      # The API may run as a non-root user: it writes requests here and deletes the answers it reads. No
      # sticky bit: with one, a root-owned answer could not be deleted by the user it answers.
      chmod 0777 "$$REQUEST_DIR"

      if [ "$${1:-run}" = "once" ]; then
        wait_for_database
        daily
        exit $$?
      fi

      log "started: daily at $${HOUR_UTC}:00 UTC, keeping $$KEEP_DAILY daily / $$KEEP_WEEKLY weekly / $$KEEP_PRE_MIGRATION pre-migration in $$BACKUP_DIR; requests first for $${GRACE}s"
      started_at=$$(date -u +%s)
      wait_for_database
      while true; do
        serve_requests
        today=$$(date -u +%Y-%m-%d)
        if [ ! -e "$$BACKUP_DIR/daily/reel-$$today.dump" ] && [ $$(( $$(date -u +%s) - started_at )) -ge "$$GRACE" ]; then
          # A host that was asleep at the hour still gets its dump the moment it wakes; a stack with no
          # dump at all takes one immediately rather than waiting for tomorrow.
          if [ "$$(date -u +%H | sed 's/^0//')" -ge "$$HOUR_UTC" ] || [ -z "$$(ls -1 "$$BACKUP_DIR"/daily/reel-*.dump 2> /dev/null)" ]; then
            wait_for_database
            daily || log "daily dump failed; retrying in 5 minutes"
          fi
        fi
        # Requests are polled every 5 seconds; the daily check runs once a minute.
        i=0
        while [ "$$i" -lt 12 ]; do
          serve_requests
          sleep 5
          i=$$(( i + 1 ))
        done
      done

volumes:
  postgres_data:
  # Handshake files only (<id>.request / .done / .failed); never holds a dump.
  backup_requests:
