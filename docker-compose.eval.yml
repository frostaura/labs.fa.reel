# fareel-eval — the isolated eval stack (program §4.12, WS-7 task 1).
#
#   docker compose -p fareel-eval -f docker-compose.eval.yml --env-file <eval env file> up -d eval-api
#
# It is a SEPARATE compose project from the live `fareel` stack and shares nothing with it: its own
# Postgres on 127.0.0.1:5434, its own database (`reel_eval`, made by scripts/eval/snapshot.sh), its own
# API on 127.0.0.1:5180. Bringing it up, down or rebuilding it never touches a live container.
#
# The env file holds the EVAL credentials only, by these names (see docs/ask-reel-eval.md):
#   EVAL_OPENROUTER_API_KEY   — the eval stack's OWN OpenRouter key with its own $10/day cap (§7 rule 3);
#   EVAL_TMDB_READ_ACCESS_TOKEN, EVAL_JWT_SECRET.
# Never point it at the repo `.env`: that file holds the founder's live credentials.
name: fareel-eval

# Same rotated `local` logging as every other descriptor (J*2); the parity test pins this block.
x-logging: &default-logging
  driver: local
  options:
    max-size: "50m"
    max-file: "10"

services:
  # ADOPTED, not created: the eval Postgres already runs as the standalone container
  # `fareel-eval-postgres` on the external volume `fareel_eval_pgdata`. This definition matches it so the
  # stack documents one database, and it sits behind the `db` profile so `up` never recreates (or
  # duplicates) the running container. Only if that container is ever lost, recreate it with
  #   docker compose -p fareel-eval -f docker-compose.eval.yml --profile db up -d eval-postgres
  # and the data comes back from the same volume.
  eval-postgres:
    profiles: [ "db" ]
    image: pgvector/pgvector:pg16
    container_name: fareel-eval-postgres
    restart: always
    environment:
      POSTGRES_USER: reel
      # A loopback-only fixture password, not a secret: the port is bound to 127.0.0.1.
      POSTGRES_PASSWORD: reel_eval
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - fareel_eval_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U reel -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    logging: *default-logging

  eval-api:
    build:
      context: .
      dockerfile: ./src/backend/Dockerfile
    image: fareel-eval-api:${EVAL_API_TAG:-local}
    restart: "no"
    ports:
      - "127.0.0.1:5180:5000"
    extra_hosts:
      # Trakt isolation, layer 1: Trakt's hosts resolve to nowhere inside this container, so no refresh
      # can rotate the founder's single-use refresh token and no write can reach his profile.
      - "api.trakt.tv:0.0.0.0"
      - "trakt.tv:0.0.0.0"
      # The eval Postgres is published on the host's loopback.
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__Postgres: Host=host.docker.internal;Port=5434;Database=${EVAL_DATABASE:-reel_eval};Username=reel;Password=reel_eval
      Database__AutoMigrateOnStartup: "true"
      JWT_SECRET: ${EVAL_JWT_SECRET:?EVAL_JWT_SECRET is required}
      # Model and catalogue keys: the eval stack's own, never the founder's (§7 rule 1).
      OPENROUTER_API_KEY: ${EVAL_OPENROUTER_API_KEY:?EVAL_OPENROUTER_API_KEY is required (the eval key, not the founder key)}
      OPENROUTER_MODEL: ${EVAL_OPENROUTER_MODEL:-openai/gpt-6-luna}
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      EMBEDDINGS_MODEL: text-embedding-3-small
      EMBEDDINGS_BASE_URL: https://openrouter.ai/api/v1
      EMBEDDINGS_API_KEY: ${EVAL_OPENROUTER_API_KEY}
      REEL_SEARCH_MODEL: ${EVAL_REEL_SEARCH_MODEL:-}
      TMDB_READ_ACCESS_TOKEN: ${EVAL_TMDB_READ_ACCESS_TOKEN:?EVAL_TMDB_READ_ACCESS_TOKEN is required}
      # Trakt isolation, layer 2: no Trakt credentials at all, the dev-link session resolves the existing
      # snapshot account by slug (no token exchange), and every outbound HTTPS call except the model and
      # TMDB hosts goes through a dead proxy.
      # Layer 3: this client id selects the in-process OfflineTraktClient (DependencyInjection.Eval.cs),
      # which fails every Trakt call before a socket opens.
      TRAKT_CLIENT_ID: eval-no-trakt
      TRAKT_CLIENT_SECRET: eval-no-trakt
      TRAKT_ACCESS_TOKEN: ""
      TRAKT_REFRESH_TOKEN: ""
      TRAKT_DEV_PROFILE: ${EVAL_TRAKT_DEV_PROFILE:-deanmar09}
      HTTPS_PROXY: http://127.0.0.1:9
      HTTP_PROXY: http://127.0.0.1:9
      NO_PROXY: openrouter.ai,api.themoviedb.org,image.tmdb.org,localhost,127.0.0.1,host.docker.internal
      QA_HELPERS_ENABLED: "true"
      # Every hosted service off. The job runner is off too unless a surface-harness run needs one Fresh
      # build (EVAL_JOB_RUNNER=true), and the snapshot has no pending jobs for it to replay.
      Background__JobRunner: ${EVAL_JOB_RUNNER:-false}
      Background__OutboxDispatcher: "false"
      Background__TokenRefresh: "false"
      Background__DeltaPoll: "false"
      Background__Digest: "false"
      Background__CatalogGrowth: "false"
      Background__NightlyReconcile: "false"
      Background__CatalogFollowThrough: "false"
      Background__LanguageBackfill: "false"
      # The eval account's Ask and rerank allowances are raised on THIS stack only (WS-7 task 1).
      LLM_RERANK_DAILY_CALLS: ${EVAL_RERANK_DAILY_CALLS:-100000}
      LLM_RERANK_DAILY_TOKENS: ${EVAL_RERANK_DAILY_TOKENS:-200000000}
      # Every other key the code reads, plumbed with the dev stack's defaults (WS-8 parity rule, K-5): an
      # absent key silently runs the code default. Eval-specific: no boot repairs and no trust purge (both
      # would mutate the snapshot or spend on start), and a blank BACKUP_REQUEST_DIR turns the
      # pre-migration dump handshake off (the eval database is a disposable copy).
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:8090}
      ASK_RETENTION_DAYS: ${ASK_RETENTION_DAYS:-}
      # WS-8 inbound limits, raised on THIS stack only (section 7 lets the eval account have more; FD-8's
      # defaults would block a golden run). Trusted proxies and the key-ring certificate as on the dev stack.
      ASK_TURNS_CONCURRENT: ${ASK_TURNS_CONCURRENT:-2}
      ASK_TURNS_PER_MINUTE: ${ASK_TURNS_PER_MINUTE:-120}
      ASK_TURNS_PER_HOUR: ${ASK_TURNS_PER_HOUR:-2000}
      ASK_TURNS_PER_DAY: ${ASK_TURNS_PER_DAY:-5000}
      ASK_TURNS_PER_DAY_FOUNDER: ${ASK_TURNS_PER_DAY_FOUNDER:-5000}
      ASK_TURNS_PER_DAY_FREE: ${ASK_TURNS_PER_DAY_FREE:-5000}
      TRUSTED_PROXY_NETWORKS: "${TRUSTED_PROXY_NETWORKS:-127.0.0.0/8,::1/128,172.16.0.0/12}"
      DATAPROTECTION_CERT_PATH: ${DATAPROTECTION_CERT_PATH:-}
      DATAPROTECTION_CERT_PASSWORD: ${DATAPROTECTION_CERT_PASSWORD:-}
      DATAPROTECTION_OLD_CERT_PATHS: ${DATAPROTECTION_OLD_CERT_PATHS:-}
      BACKUP_PRE_MIGRATION_REQUIRED: ${BACKUP_PRE_MIGRATION_REQUIRED:-true}
      BACKUP_PRE_MIGRATION_TIMEOUT_SECONDS: ${BACKUP_PRE_MIGRATION_TIMEOUT_SECONDS:-1800}
      BACKUP_REQUEST_DIR: ""
      Background__DataRepairs: "false"
      Background__TrustPurge: "false"
      Background__KeywordVocabulary: "false"
      Background__TraktRatingsBackfill: "false"
      Background__Retention: "false"
      Tenancy__UnscopedReads: "Warn"
      CALIBRATOR_MODE: ${CALIBRATOR_MODE:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8090,http://localhost:5173}
      EMBED_DAILY_TOKENS: ${EMBED_DAILY_TOKENS:-3000000}
      ENRICH_MAX_TITLES_PER_RUN: ${ENRICH_MAX_TITLES_PER_RUN:-}
      EXTRACT_DAILY_TOKENS: ${EXTRACT_DAILY_TOKENS:-1500000}
      GEOIP_DEFAULT_REGION: ${GEOIP_DEFAULT_REGION:-US}
      HYDRATE_MAX_TITLES_PER_DAY: ${HYDRATE_MAX_TITLES_PER_DAY:-1500}
      INTERLEAVE_ALPHA: ${INTERLEAVE_ALPHA:-}
      INTERLEAVE_ENABLED: ${INTERLEAVE_ENABLED:-}
      INTERLEAVE_MSPRT_TAU: ${INTERLEAVE_MSPRT_TAU:-}
      INTERLEAVE_POLICY_A: ${INTERLEAVE_POLICY_A:-}
      INTERLEAVE_POLICY_B: ${INTERLEAVE_POLICY_B:-}
      JWT_ACCESS_TOKEN_EXPIRY_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRY_MINUTES:-15}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-frostaura-reel-app}
      JWT_ISSUER: ${JWT_ISSUER:-frostaura-reel}
      JWT_REFRESH_TOKEN_EXPIRY_DAYS: ${JWT_REFRESH_TOKEN_EXPIRY_DAYS:-30}
      KILL_CRITERION_ITERATIONS: ${KILL_CRITERION_ITERATIONS:-3}
      LLM_EFFORT_UNSUPPORTED: ${LLM_EFFORT_UNSUPPORTED:-}
      LLM_LENS_DAILY_CALLS: ${LLM_LENS_DAILY_CALLS:-}
      LLM_LENS_DAILY_TOKENS: ${LLM_LENS_DAILY_TOKENS:-}
      LLM_LENS_EFFORT: ${LLM_LENS_EFFORT:-}
      LLM_TASTE_NARRATIVE_EFFORT: ${LLM_TASTE_NARRATIVE_EFFORT:-}
      LLM_XREF_DAILY_CALLS: ${LLM_XREF_DAILY_CALLS:-}
      LLM_XREF_DAILY_TOKENS: ${LLM_XREF_DAILY_TOKENS:-}
      OPENROUTER_MAX_CONCURRENCY: ${OPENROUTER_MAX_CONCURRENCY:-4}
      Push__Subject: ${Push__Subject:-https://reel.frostaura.net}
      RESIDUAL_HEAD_ENABLED: ${RESIDUAL_HEAD_ENABLED:-}
      RESIDUAL_OBSERVE_TRAKT_RATINGS: ${RESIDUAL_OBSERVE_TRAKT_RATINGS:-}
      RETRAIN_MIN_NEW_RATINGS: ${RETRAIN_MIN_NEW_RATINGS:-10}
      SEED_MAX_TITLES: ${SEED_MAX_TITLES:-60000}
      SEED_MOVIE_MIN_VOTES: ${SEED_MOVIE_MIN_VOTES:-500}
      SEED_PAGES_PER_RUN: ${SEED_PAGES_PER_RUN:-400}
      SEED_SHOW_MIN_VOTES: ${SEED_SHOW_MIN_VOTES:-200}
      STRIPE_PRICE_ID: ${STRIPE_PRICE_ID:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      SYNC_DELTA_MINUTES: ${SYNC_DELTA_MINUTES:-15}
      SYNC_HOT_MINUTES: ${SYNC_HOT_MINUTES:-5}
      TMDB_RATE_PER_SEC: ${TMDB_RATE_PER_SEC:-40}
      TRAKT_RATE_BUDGET_PER_5MIN: ${TRAKT_RATE_BUDGET_PER_5MIN:-900}
      TRAKT_REDIRECT_URI: ${TRAKT_REDIRECT_URI:-http://localhost:5173/auth/trakt/callback}
      TestHelpers__ModelStubMode: ${TestHelpers__ModelStubMode:-false}
    healthcheck:
      test: [ "CMD-SHELL", "curl --noproxy '*' --fail --silent http://127.0.0.1:5000/health >/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    logging: *default-logging

volumes:
  fareel_eval_pgdata:
    external: true
