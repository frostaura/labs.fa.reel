# fareel-eval — the isolated eval stack (program §4.12, WS-7 task 1).
#
#   docker compose -p fareel-eval -f docker-compose.eval.yml --env-file <eval env file> up -d eval-api
#
# It is a SEPARATE compose project from the live `fareel` stack and shares nothing with it: its own
# Postgres on 127.0.0.1:5434, its own database (`reel_eval`, made by scripts/eval/snapshot.sh), its own
# API on 127.0.0.1:5180. Bringing it up, down or rebuilding it never touches a live container.
#
# The env file holds the EVAL credentials only, by these names (see docs/ask-reel-eval.md):
#   EVAL_OPENROUTER_API_KEY   — the eval stack's OWN OpenRouter key with its own $10/day cap (§7 rule 3);
#   EVAL_TMDB_READ_ACCESS_TOKEN, EVAL_JWT_SECRET.
# Never point it at the repo `.env`: that file holds the founder's live credentials.
name: fareel-eval

services:
  # ADOPTED, not created: the eval Postgres already runs as the standalone container
  # `fareel-eval-postgres` on the external volume `fareel_eval_pgdata`. This definition matches it so the
  # stack documents one database, and it sits behind the `db` profile so `up` never recreates (or
  # duplicates) the running container. Only if that container is ever lost, recreate it with
  #   docker compose -p fareel-eval -f docker-compose.eval.yml --profile db up -d eval-postgres
  # and the data comes back from the same volume.
  eval-postgres:
    profiles: [ "db" ]
    image: pgvector/pgvector:pg16
    container_name: fareel-eval-postgres
    restart: always
    environment:
      POSTGRES_USER: reel
      # A loopback-only fixture password, not a secret: the port is bound to 127.0.0.1.
      POSTGRES_PASSWORD: reel_eval
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - fareel_eval_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U reel -d postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  eval-api:
    build:
      context: .
      dockerfile: ./src/backend/Dockerfile
    image: fareel-eval-api:${EVAL_API_TAG:-local}
    restart: "no"
    ports:
      - "127.0.0.1:5180:5000"
    extra_hosts:
      # Trakt isolation, layer 1: Trakt's hosts resolve to nowhere inside this container, so no refresh
      # can rotate the founder's single-use refresh token and no write can reach his profile.
      - "api.trakt.tv:0.0.0.0"
      - "trakt.tv:0.0.0.0"
      # The eval Postgres is published on the host's loopback.
      - "host.docker.internal:host-gateway"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5000
      ConnectionStrings__Postgres: Host=host.docker.internal;Port=5434;Database=${EVAL_DATABASE:-reel_eval};Username=reel;Password=reel_eval
      Database__AutoMigrateOnStartup: "true"
      JWT_SECRET: ${EVAL_JWT_SECRET:?EVAL_JWT_SECRET is required}
      # Model and catalogue keys: the eval stack's own, never the founder's (§7 rule 1).
      OPENROUTER_API_KEY: ${EVAL_OPENROUTER_API_KEY:?EVAL_OPENROUTER_API_KEY is required (the eval key, not the founder key)}
      OPENROUTER_MODEL: ${EVAL_OPENROUTER_MODEL:-openai/gpt-6-luna}
      OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
      EMBEDDINGS_PROVIDER: openai
      EMBEDDINGS_MODEL: text-embedding-3-small
      EMBEDDINGS_DIMENSIONS: "1536"
      EMBEDDINGS_BASE_URL: https://openrouter.ai/api/v1
      EMBEDDINGS_API_KEY: ${EVAL_OPENROUTER_API_KEY}
      REEL_SEARCH_MODEL: ${EVAL_REEL_SEARCH_MODEL:-}
      TMDB_READ_ACCESS_TOKEN: ${EVAL_TMDB_READ_ACCESS_TOKEN:?EVAL_TMDB_READ_ACCESS_TOKEN is required}
      # Trakt isolation, layer 2: no Trakt credentials at all, the dev-link session resolves the existing
      # snapshot account by slug (no token exchange), and every outbound HTTPS call except the model and
      # TMDB hosts goes through a dead proxy.
      TRAKT_CLIENT_ID: eval-no-trakt
      TRAKT_CLIENT_SECRET: eval-no-trakt
      TRAKT_ACCESS_TOKEN: ""
      TRAKT_REFRESH_TOKEN: ""
      TRAKT_DEV_PROFILE: ${EVAL_TRAKT_DEV_PROFILE:-deanmar09}
      HTTPS_PROXY: http://127.0.0.1:9
      HTTP_PROXY: http://127.0.0.1:9
      NO_PROXY: openrouter.ai,api.themoviedb.org,image.tmdb.org,localhost,127.0.0.1,host.docker.internal
      QA_HELPERS_ENABLED: "true"
      # Every hosted service off. The job runner is off too unless a surface-harness run needs one Fresh
      # build (EVAL_JOB_RUNNER=true), and the snapshot has no pending jobs for it to replay.
      Background__JobRunner: ${EVAL_JOB_RUNNER:-false}
      Background__OutboxDispatcher: "false"
      Background__TokenRefresh: "false"
      Background__DeltaPoll: "false"
      Background__Digest: "false"
      Background__CatalogGrowth: "false"
      Background__NightlyReconcile: "false"
      Background__CatalogFollowThrough: "false"
      Background__LanguageBackfill: "false"
      # The eval account's Ask and rerank allowances are raised on THIS stack only (WS-7 task 1).
      LLM_RERANK_DAILY_CALLS: ${EVAL_RERANK_DAILY_CALLS:-100000}
      LLM_RERANK_DAILY_TOKENS: ${EVAL_RERANK_DAILY_TOKENS:-200000000}
    healthcheck:
      test: [ "CMD-SHELL", "curl --noproxy '*' --fail --silent http://127.0.0.1:5000/health >/dev/null || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s
    logging:
      driver: local
      options:
        max-size: 50m
        max-file: "10"

volumes:
  fareel_eval_pgdata:
    external: true
