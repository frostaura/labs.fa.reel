server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # Pure static SPA server. API / SSE routing is owned by the gateway reverse proxy
  # (nginx/nginx.conf), which routes /api and /sse to the backend and everything else here.

  gzip on;
  gzip_vary on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

  # Hashed build output: a file's name changes whenever its content does, so it is cached for a
  # year and never revalidated. A name that does not exist is a 404 — NOT index.html (I-3): a stale
  # tab asking for last deploy's chunk must fail as a missing script, which the app's load-failure
  # path catches and reloads from, rather than receive HTML with a 200 and die parsing it as JS.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
  }

  # Source maps are never served (J-15). The build still writes them, for local debugging.
  location ~* \.map$ {
    return 404;
  }

  # The two files that decide which build a browser runs must never be served from a cache: a
  # cached index.html pins old asset names, and a cached sw.js keeps the old service worker in
  # control. no-cache = revalidate every time (ETag makes that a 304 when nothing changed).
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache" always;
  }

  # Client-side routes fall back to the SPA shell, which is index.html and so equally uncached.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache" always;
  }
}
