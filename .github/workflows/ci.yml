name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Every gate below runs a `make ci-*` target, never its own copy of the command: `make ci` on a
  # laptop and this workflow are the same claim (docs/deployment.md#local-ci). Change a gate in the
  # Makefile, not here.

  # ============================================================================
  # Backend — format, warning-free build, unit tests + coverage, replay suite
  # ============================================================================
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/backend/**/*.csproj', '*.slnx') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Format
        run: make ci-format

      - name: Build (warnings are errors)
        run: make ci-build

      - name: Unit tests + coverage ratchet
        run: make ci-test

      - name: Setup Node.js (replay suite)
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Ask Reel replay suite (recorded plans and verdicts, zero paid calls)
        run: make ci-replay

  # ============================================================================
  # Contract — the committed OpenAPI document and generated TS types match the build
  # ============================================================================
  contract:
    name: OpenAPI contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ./src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./src/frontend
        run: npm ci

      - name: OpenAPI diff
        run: make ci-openapi

  # ============================================================================
  # Frontend — lint, typecheck, unit tests + coverage, warning-free build, knip, dev-proxy probe
  # ============================================================================
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ./src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./src/frontend
        run: npm ci

      - name: Lint
        run: make ci-frontend-lint

      - name: Typecheck
        run: make ci-frontend-typecheck

      - name: Unit tests + coverage ratchet
        run: make ci-frontend-test

      - name: Build (warnings are errors)
        run: make ci-frontend-build

      - name: Unused files, exports and dependencies (knip)
        run: make ci-knip

      - name: Dev proxy records its client and listens on loopback (J-1)
        run: make ci-vite-proxy

  # ============================================================================
  # Frontend E2E — Playwright, Chromium and WebKit
  # ============================================================================
  frontend-e2e:
    name: Frontend E2E
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ./src/frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./src/frontend
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./src/frontend
        run: npx playwright install --with-deps chromium webkit

      - name: Run E2E tests (Chromium + WebKit)
        timeout-minutes: 15
        run: make ci-e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            ./src/frontend/test-results/
            ./src/frontend/playwright-report/
          retention-days: 7
          # Playwright only writes these on failure (trace/screenshot retain-on-failure), so a
          # green run has nothing to upload. The default `warn` annotated every passing build.
          if-no-files-found: ignore

  # ============================================================================
  # Security — npm + NuGet advisories, Trivy (vulnerable dependencies, committed secrets)
  # ============================================================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [frontend, backend]
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ./src/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: ./src/frontend
        run: npm ci

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # npm: `npm audit --audit-level=high` with an expiring, per-advisory allowlist
      # (src/frontend/scripts/audit-gate.mjs). NuGet: any vulnerable package, transitive included.
      - name: Dependency advisories (npm + NuGet)
        run: make ci-audit

      # The Makefile pins Trivy by image digest and runs it on the runner's Docker, exactly as it does
      # on a laptop (R1-33) — not a floating action tag, which can be repointed under a workflow that
      # trusts it, and not a second version pin here that could drift from the Makefile's.
      - name: Trivy (pinned image, same as make ci)
        run: make ci-trivy

  # ============================================================================
  # Backend Integration — real Postgres (pgvector) boundary checks
  # ============================================================================
  backend-integration:
    name: Backend Integration (Postgres + pgvector)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend]
    services:
      postgres:
        # pgvector image: the vector + pg_trgm migrations must apply in CI exactly as in prod.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: reel
          POSTGRES_PASSWORD: reel_test_pw
          POSTGRES_DB: reel_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reel"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Run integration tests against Postgres
        env:
          REEL_TEST_CONNECTION_STRING: Host=localhost;Port=5432;Database=reel_test;Username=reel;Password=reel_test_pw
          # ci-integration sets REEL_REQUIRE_INTEGRATION=1, turning a missing database into a hard
          # failure, and fails if no test ran. There is deliberately NO REEL_SKIP_LOCAL_FLAKY here:
          # CI's pgvector service is authoritative and runs the quarantined tests too.
        run: make ci-integration

  # ============================================================================
  # Docker — every descriptor parses; both images build; the composed stack serves
  # ============================================================================
  # Runs on pull requests too, deliberately: until this job existed the Dockerfiles and the
  # compose wiring were only exercised by the publish jobs, which are push-to-main only. A
  # broken image or gateway route therefore passed CI on the PR and only surfaced after the
  # merge — after a bad :latest had already been pushed. This gate moves that failure left.
  docker:
    name: Docker Build & Stack Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Validate every compose descriptor
        run: make ci-compose

      - name: Build images and smoke the composed stack
        # /health, /health/ready (real pgvector migrations applied, after the pre-migration dump
        # handshake with the backup service) and / (SPA bundle) through the gateway.
        run: make ci-docker

  # ============================================================================
  # Docker Build & Push — only on push to main, after all CI gates pass
  # ============================================================================
  build-backend-amd64:
    name: Build Backend (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, contract, frontend, frontend-e2e, backend-integration, security, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tag for this commit
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image (amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/backend/Dockerfile
          push: true
          platforms: linux/amd64
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/reel-backend:latest-amd64
            ${{ secrets.DOCKERHUB_USERNAME }}/reel-backend:${{ steps.tag.outputs.tag }}-amd64

  build-backend-arm64:
    name: Build Backend (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    needs: [backend, contract, frontend, frontend-e2e, backend-integration, security, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tag for this commit
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push backend image (arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/backend/Dockerfile
          push: true
          platforms: linux/arm64
          build-args: |
            GIT_SHA=${{ github.sha }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/reel-backend:latest-arm64
            ${{ secrets.DOCKERHUB_USERNAME }}/reel-backend:${{ steps.tag.outputs.tag }}-arm64

  merge-backend-manifests:
    name: Create Backend Multi-arch Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build-backend-amd64, build-backend-arm64]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Two names for one manifest: `sha-<short>` is what a deploy pins (REEL_TAG) and what a
      # rollback names; `latest` is only a convenience for a stack that pins nothing (K-9).
      - name: Create and push manifest
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/reel-backend
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA::7}"
          docker buildx imagetools create -t "$IMAGE:$tag" -t "$IMAGE:latest" \
            "$IMAGE:$tag-amd64" \
            "$IMAGE:$tag-arm64"

  build-frontend-amd64:
    name: Build Frontend (amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend, contract, frontend, frontend-e2e, backend-integration, security, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tag for this commit
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image (amd64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/frontend/Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/reel-frontend:latest-amd64
            ${{ secrets.DOCKERHUB_USERNAME }}/reel-frontend:${{ steps.tag.outputs.tag }}-amd64

  build-frontend-arm64:
    name: Build Frontend (arm64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    needs: [backend, contract, frontend, frontend-e2e, backend-integration, security, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image tag for this commit
        id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push frontend image (arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./src/frontend/Dockerfile
          push: true
          platforms: linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/reel-frontend:latest-arm64
            ${{ secrets.DOCKERHUB_USERNAME }}/reel-frontend:${{ steps.tag.outputs.tag }}-arm64

  merge-frontend-manifests:
    name: Create Frontend Multi-arch Manifest
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build-frontend-amd64, build-frontend-arm64]
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Two names for one manifest: `sha-<short>` is what a deploy pins (REEL_TAG) and what a
      # rollback names; `latest` is only a convenience for a stack that pins nothing (K-9).
      - name: Create and push manifest
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/reel-frontend
        run: |
          set -euo pipefail
          tag="sha-${GITHUB_SHA::7}"
          docker buildx imagetools create -t "$IMAGE:$tag" -t "$IMAGE:latest" \
            "$IMAGE:$tag-amd64" \
            "$IMAGE:$tag-arm64"

  # ============================================================================
  # Portainer deploy — pin the stack to this commit's images, redeploy, prove it (K-9, J-22)
  # ============================================================================
  # DISABLED until the reel Portainer stack exists. Re-enable by setting the
  # repository variable DEPLOY_ENABLED=true (Settings → Secrets and variables →
  # Actions → Variables) once PORTAINER_STACK_ID + the stack are in place. While
  # the variable is unset the job is skipped (not failed), so CI stays green.
  #
  # The job sets the stack's REEL_TAG to `sha-<short>` (docker-compose.prod.yml pulls
  # reel-*:${REEL_TAG}), so the stack names the exact images it runs and a rollback is one REEL_TAG
  # edit. It then polls the public /health until the commit it reports is this one, and FAILS if
  # that never happens: a redeploy Portainer accepted is not a deploy that is serving. The window
  # covers the backend's pre-migration dump and migrations (its healthcheck start_period is 40 min).
  deploy-portainer:
    name: Pin, redeploy on Portainer and verify /health
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: [merge-backend-manifests, merge-frontend-manifests]
    if: vars.DEPLOY_ENABLED == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Pin REEL_TAG and redeploy
        env:
          PORTAINER_URL: ${{ secrets.PORTAINER_URL }}
          PORTAINER_TOKEN: ${{ secrets.PORTAINER_TOKEN }}
          PORTAINER_ENDPOINT_ID: ${{ secrets.PORTAINER_ENDPOINT_ID }}
          PORTAINER_STACK_ID: ${{ secrets.PORTAINER_STACK_ID }}
        run: |
          set -euo pipefail
          : "${PORTAINER_URL:?secret PORTAINER_URL is required}"
          : "${PORTAINER_TOKEN:?secret PORTAINER_TOKEN is required}"
          : "${PORTAINER_ENDPOINT_ID:?secret PORTAINER_ENDPOINT_ID is required}"
          : "${PORTAINER_STACK_ID:?secret PORTAINER_STACK_ID is required}"

          api="${PORTAINER_URL%/}/api"
          tag="sha-${GITHUB_SHA::7}"

          stack_file_content=$(curl -fsSL -H "X-API-Key: ${PORTAINER_TOKEN}" \
            "${api}/stacks/${PORTAINER_STACK_ID}/file" | jq -r '.StackFileContent')
          # A stored stack file that does not read REEL_TAG would redeploy `latest` and report the pin
          # as done. Refuse instead: paste the current docker-compose.prod.yml into the stack once.
          if ! grep -q 'REEL_TAG' <<< "${stack_file_content}"; then
            echo "The Portainer stack file does not reference REEL_TAG; paste docker-compose.prod.yml into it first (docs/deployment.md#deploys-and-rollback)." >&2
            exit 1
          fi

          # The stack's env with REEL_TAG replaced (or added). Values are never printed.
          env_array=$(curl -fsSL -H "X-API-Key: ${PORTAINER_TOKEN}" \
            "${api}/stacks/${PORTAINER_STACK_ID}" \
            | jq -c --arg tag "${tag}" '(.Env // []) | map(select(.name != "REEL_TAG")) + [{name: "REEL_TAG", value: $tag}]')

          body=$(jq -n --arg sfc "${stack_file_content}" --argjson env "${env_array}" \
            '{stackFileContent: $sfc, env: $env, prune: false, pullImage: true}')

          http_code=$(curl -sS -o /tmp/portainer-resp.json -w "%{http_code}" \
            -X PUT "${api}/stacks/${PORTAINER_STACK_ID}?endpointId=${PORTAINER_ENDPOINT_ID}" \
            -H "X-API-Key: ${PORTAINER_TOKEN}" \
            -H "Content-Type: application/json" \
            --data "${body}")
          echo "Portainer responded with HTTP ${http_code}"
          if [ "${http_code}" -ge 400 ]; then
            cat /tmp/portainer-resp.json
            exit 1
          fi
          echo "Stack ${PORTAINER_STACK_ID} redeployed with REEL_TAG=${tag}."

      - name: Wait for this commit to answer /health
        env:
          HEALTH_URL: ${{ vars.DEPLOY_HEALTH_URL || 'https://reel.frostaura.net/health' }}
        run: |
          set -uo pipefail
          deadline=$(( $(date +%s) + 45 * 60 ))
          while [ "$(date +%s)" -lt "${deadline}" ]; do
            commit=$(curl -fsS --max-time 10 "${HEALTH_URL}" 2>/dev/null | jq -r '.commit // empty' 2>/dev/null || true)
            if [ "${commit}" = "${GITHUB_SHA}" ]; then
              echo "Serving ${GITHUB_SHA}."
              exit 0
            fi
            echo "Not yet: /health reports '${commit:-no answer}'."
            sleep 20
          done
          echo "::error::${HEALTH_URL} never reported ${GITHUB_SHA} within 45 minutes; the deploy is not serving. Roll back with REEL_TAG (docs/deployment.md#deploys-and-rollback)."
          exit 1
