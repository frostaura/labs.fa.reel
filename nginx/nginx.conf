# labs.fa.reel — Gateway Reverse Proxy (envsubst template)
# Single public entry point: routes /api and /sse traffic to the backend,
# everything else to the frontend SPA.
#
# THE ONLY COPY. Production does not carry this file: nginx/Dockerfile bakes it into the
# labs.fa.reel-gateway image CI publishes beside labs.fa.reel-backend and labs.fa.reel-frontend, and docker-compose.prod.yml
# runs that image. The dev compose stack mounts this same file as its template. The ${NGINX_*}
# values are filled in at container start from the environment (defaults in nginx/Dockerfile and
# docker-compose.yml); every other $ is nginx's own. Verify a change with deploy/probe-gateway.sh,
# which builds the image and runs it against stub upstreams.

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # rid= is the X-Request-Id the API logs as RequestId and returns to the caller (R1-36).
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" rid=$request_id';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # No nginx version in the Server header or on error pages (K-8).
    server_tokens off;

    # Compression for everything text-shaped the gateway relays: API JSON here, and the SPA's
    # assets when the frontend container has not already compressed them (nginx never re-gzips a
    # response that arrives with a Content-Encoding). text/event-stream is deliberately absent:
    # a compressed stream is a buffered stream. The Ask location below turns gzip off outright.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

    # The scheme the visitor actually used. cloudflared terminates TLS and sends
    # X-Forwarded-Proto: https; the gateway itself only ever sees http, so forwarding its own
    # $scheme told the API every production request was plain HTTP (J-7). A request with no header
    # (local QA straight to the gateway) is what it is: $scheme.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        "" $scheme;
    }

    # HSTS only on a response to an HTTPS visitor: an empty value means nginx sends no header.
    map $forwarded_proto $hsts {
        https "max-age=31536000";
        default "";
    }

    server {
        listen 80;
        server_name _;

        # Docker's embedded DNS, re-consulted every 10s. Load-bearing: nginx resolves an `upstream`
        # block's hostname ONCE at startup and caches the IP forever, so recreating the backend or
        # frontend container — which `docker compose up --build backend` does routinely — handed
        # this gateway a dead IP and it 502'd the whole app until someone restarted it by hand.
        # Nothing crashes, so no restart policy can catch it; the stack looks healthy from
        # `docker ps` while every request fails.
        resolver 127.0.0.11 valid=10s ipv6=off;

        # The hostnames live in variables ON PURPOSE. A literal proxy_pass target is resolved at
        # config-load time; a variable one is resolved per request, which is what makes the
        # `resolver` above actually apply. $request_uri carries the original path AND query string,
        # so it must be passed explicitly — a variable proxy_pass does no URI rewriting of its own.
        set $backend_host backend;
        set $frontend_host frontend;

        # Security headers on every response (K-14). Declared here and in NO location: an add_header
        # inside a location replaces this whole set for that location instead of adding to it.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header Strict-Transport-Security $hsts always;

        # Source maps are a build artefact, never served (J-15).
        location ~* \.map$ {
            return 404;
        }

        # --- Ask Reel: a token-by-token SSE turn ---
        # Its own block (I-13): never gzipped, never buffered, and an hour to finish. Everything else
        # under /api/ is ordinary JSON and is compressed and buffered like any other response.
        location = /api/search/ask {
            proxy_pass http://$backend_host:${NGINX_BACKEND_PORT}$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            # One id from the gateway's access log to every API log line and the X-Request-Id response
            # header (R1-36). Always the gateway's own: an id from the internet is not forwarded.
            proxy_set_header X-Request-Id $request_id;
            proxy_set_header CF-IPCountry $http_cf_ipcountry;
            # The gateway's HSTS stands for every response; the API's copy would be a duplicate.
            proxy_hide_header Strict-Transport-Security;
            client_max_body_size ${NGINX_CLIENT_MAX_BODY_SIZE};
            gzip off;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 3600s;
        }

        # --- Backend API routes ---

        location /api/ {
            proxy_pass http://$backend_host:${NGINX_BACKEND_PORT}$request_uri;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            # One id from the gateway's access log to every API log line and the X-Request-Id response
            # header (R1-36). Always the gateway's own: an id from the internet is not forwarded.
            proxy_set_header X-Request-Id $request_id;
            # Cloudflare provides the country code in prod; forward it for the geo-IP
            # region default at signup.
            proxy_set_header CF-IPCountry $http_cf_ipcountry;
            proxy_hide_header Strict-Transport-Security;
            client_max_body_size ${NGINX_CLIENT_MAX_BODY_SIZE};
            proxy_http_version 1.1;
            proxy_set_header Connection '';
            # Long enough for the slowest founder diagnostics; a response that streams sets
            # X-Accel-Buffering: no itself, which nginx honours per response.
            proxy_read_timeout 300s;
        }

        # SSE streams — disable buffering for the pipeline/onboarding event channel
        location /sse/ {
            proxy_pass http://$backend_host:${NGINX_BACKEND_PORT}$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            # One id from the gateway's access log to every API log line and the X-Request-Id response
            # header (R1-36). Always the gateway's own: an id from the internet is not forwarded.
            proxy_set_header X-Request-Id $request_id;
            proxy_hide_header Strict-Transport-Security;
            gzip off;
            proxy_set_header Connection '';
            proxy_http_version 1.1;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
        }

        # Health check passthrough (the API maps /health)
        location /health {
            proxy_pass http://$backend_host:${NGINX_BACKEND_PORT}$request_uri;
            proxy_hide_header Strict-Transport-Security;
        }

        # Readiness — /health is a liveness ping that answers before the app can serve anything.
        # /health/ready checks the database and pending migrations, which is what the compose
        # healthchecks gate on; stated as its own location so an external monitor reaches the same
        # answer they do, and so a future `location /health` restriction cannot silently take it.
        location /health/ready {
            proxy_pass http://$backend_host:${NGINX_BACKEND_PORT}$request_uri;
            proxy_hide_header Strict-Transport-Security;
        }

        # --- Frontend (SPA) — catch-all ---
        # Caching and the /assets/ 404 rule are the frontend container's (src/frontend/nginx.conf);
        # its Cache-Control headers pass through untouched.
        location / {
            proxy_pass http://$frontend_host:${NGINX_FRONTEND_PORT}$request_uri;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }
    }
}
