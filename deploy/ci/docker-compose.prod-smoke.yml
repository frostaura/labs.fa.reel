# Overlay for `make ci-docker-prod`: runs docker-compose.prod.yml ITSELF, built from this checkout,
# so the production descriptor and the labs.fa.reel-gateway image are smoked before anything is published.
# Never a deployment file — Portainer never sees it.
#
# What it changes, and nothing else:
#   - backend, frontend and gateway gain a `build:` so compose builds this commit's images and tags
#     them with the prod file's own image names (make passes a throwaway DOCKERHUB_USERNAME and
#     REEL_TAG, so no real frostaura/labs.fa.reel-* tag on the machine is ever overwritten);
#   - the gateway is published on loopback for the probe ONLY HERE — the prod file publishes nothing;
#   - cloudflared is parked behind a profile nobody enables: it needs a real tunnel token, and a smoke
#     must never open a public edge.
# Paths resolve against the project directory (the repository root, where the prod file lives).
services:
  backend:
    build:
      context: .
      dockerfile: ./src/backend/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}

  frontend:
    build:
      context: .
      dockerfile: ./src/frontend/Dockerfile

  gateway:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${GATEWAY_PORT:?GATEWAY_PORT is required for the smoke probe}:80"

  cloudflared:
    profiles: [ "tunnel-never-in-smoke" ]
